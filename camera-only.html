<!DOCTYPE html>
<html>
<head>
    <title>Before AR - Raw Camera</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .label { position: absolute; top: 10px; left: 10px; color: white; background: rgba(0,0,0,0.5); padding: 5px 10px; font-family: sans-serif; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="label">Step 1: Raw Feed (No AR)</div>
    <video id="video" autoplay playsinline></video>
    <script>
        const video = document.getElementById('video');
        navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(stream => { video.srcObject = stream; })
            .catch(err => { console.error("Camera access denied:", err); });
    </script>
</body>
</html>
