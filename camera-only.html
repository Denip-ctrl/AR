<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        video { width: 100%; height: 100%; object-fit: cover; background: #222; }
        #btn { position: absolute; z-index: 20; padding: 15px 30px; background: white; border-radius: 10px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <button id="btn">START CAMERA VIEW</button>
    <video id="v" autoplay muted playsinline></video>

    <script>
        const v = document.getElementById('v');
        const b = document.getElementById('btn');

        b.onclick = () => {
            navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: "environment" } 
            })
            .then(stream => {
                v.srcObject = stream;
                // CRITICAL: Some browsers need an explicit play call after setting srcObject
                v.onloadedmetadata = () => {
                    v.play().catch(e => console.error("Final play error:", e));
                };
                b.style.display = 'none';
            })
            .catch(err => alert("Camera blocked: " + err.message));
        };
    </script>
</body>
</html>
