<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { margin: 0; background: #000; color: #0f0; font-family: monospace; display: flex; flex-direction: column; height: 100vh; }
        video { flex: 1; width: 100%; background: #222; object-fit: cover; }
        #log { padding: 10px; font-size: 12px; background: #111; height: 60px; overflow-y: scroll; border-top: 1px solid #333; }
        button { width: 100%; padding: 20px; background: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <video id="v" autoplay playsinline muted></video>
    <div id="log">Status: Ready. Waiting for click...</div>
    <button id="go">ACTIVATE RAW DATA STREAM</button>

    <script>
        const v = document.getElementById('v');
        const l = document.getElementById('log');
        const b = document.getElementById('go');

        function print(msg) { l.innerHTML += "<br>> " + msg; l.scrollTop = l.scrollHeight; }

        b.onclick = () => {
            print("Requesting hardware access...");
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(stream => {
                print("SUCCESS: Stream received.");
                v.srcObject = stream;
                v.onloadedmetadata = () => {
                    print("SUCCESS: Video dimensions detected.");
                    v.play();
                    b.style.display = 'none';
                };
            })
            .catch(err => {
                print("ERROR: " + err.name);
                if(err.name === "NotAllowedError") print("Action: Click the Lock icon in URL bar and 'Allow' Camera.");
            });
        };
    </script>
</body>
</html>
