<!DOCTYPE html>
<html>
<head>
    <title>AR Split Pipeline</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@master/aframe/build/aframe-ar.js"></script>
    <style>
        body { margin: 0; background: #111; color: white; font-family: sans-serif; }
        .view-wrapper { display: flex; height: 100vh; flex-direction: column; }
        #btn-area { padding: 10px; text-align: center; background: #000; }
        .display-grid { display: flex; flex: 1; gap: 5px; padding: 5px; }
        .box { flex: 1; position: relative; border: 1px solid #444; background: #000; overflow: hidden; }
        video, canvas { width: 100% !important; height: 100% !important; object-fit: cover; }
        .label { position: absolute; top: 5px; left: 5px; z-index: 10; font-size: 10px; background: rgba(0,0,0,0.6); padding: 2px 5px; }
    </style>
</head>
<body>

    <div class="view-wrapper">
        <div id="btn-area">
            <button id="initBtn" style="width: 100%; padding: 15px; background: #28a745; color: white; border: none; font-weight: bold; border-radius: 5px; cursor: pointer;">
                ACTIVATE DATA PIPELINE
            </button>
        </div>

        <div class="display-grid">
            <div class="box">
                <div class="label">DISPLAY 1: RAW DATA</div>
                <video id="rawVideo" autoplay playsinline muted></video>
            </div>

            <div class="box" id="arContainer">
                <div class="label">DISPLAY 2: AR OVERLAY</div>
                </div>
        </div>
    </div>

    <script>
        document.getElementById('initBtn').onclick = function() {
            const btn = this;
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(stream => {
                // Track 1: RAW
                document.getElementById('rawVideo').srcObject = stream;
                
                // Track 2: AR PROCESSING
                const scene = document.createElement('a-scene');
                scene.setAttribute('embedded', '');
                scene.setAttribute('arjs', 'sourceType: webcam; debugUIEnabled: false;');
                scene.innerHTML = `
                    <a-marker preset="hiro">
                        <a-box position="0 0.5 0" material="color: #FFD700; opacity: 0.8" animation="property: rotation; to: 0 360 0; loop: true; dur: 3000"></a-box>
                    </a-marker>
                    <a-entity camera></a-entity>
                `;
                document.getElementById('arContainer').appendChild(scene);
                btn.style.display = 'none';
                
                // Force sync
                window.dispatchEvent(new Event('resize'));
            })
            .catch(e => alert("Pipeline Blocked: " + e.message));
        };
    </script>
</body>
</html>
