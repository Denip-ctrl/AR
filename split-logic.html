<!DOCTYPE html>
<html>
<head>
    <title>AR Split Pipeline</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@master/aframe/build/aframe-ar.js"></script>
    <style>
        body { margin: 0; font-family: sans-serif; background: #111; color: white; display: flex; flex-direction: column; height: 100vh; }
        .container { display: flex; flex: 1; gap: 10px; padding: 10px; }
        .view { flex: 1; position: relative; border: 2px solid #444; border-radius: 8px; overflow: hidden; background: #000; }
        .label { position: absolute; top: 10px; left: 10px; z-index: 100; background: rgba(0,0,0,0.7); padding: 5px 10px; font-size: 12px; }
        button { padding: 20px; background: #28a745; color: white; border: none; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <button id="initBtn">START DATA PIPELINE</button>

    <div class="container">
        <div class="view">
            <div class="label">DISPLAY 1: RAW CAMERA (NO AR)</div>
            <video id="rawVideo" autoplay playsinline muted style="width:100%; height:100%; object-fit:cover;"></video>
        </div>

        <div class="view" id="arView">
            <div class="label">DISPLAY 2: AR PROCESSING (OVERLAY)</div>
            </div>
    </div>

    <script>
        const btn = document.getElementById('initBtn');
        const rawVideo = document.getElementById('rawVideo');

        btn.onclick = () => {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
            .then(stream => {
                // Track 1: Direct to Raw Video
                rawVideo.srcObject = stream;
                
                // Track 2: Inject the AR Engine into Display 2
                initAR(stream);
                btn.style.display = 'none';
            })
            .catch(err => alert("Pipeline Error: " + err.name));
        };

        function initAR(stream) {
            const arContainer = document.getElementById('arView');
            const sceneHTML = `
                <a-scene embedded arjs="sourceType: video; debugUIEnabled: false;" style="width:100%; height:100%;">
                    <a-marker preset="hiro">
                        <a-box position="0 0.5 0" material="color: #FFD700; opacity: 0.8" animation="property: rotation; to: 0 360 0; loop: true; dur: 3000"></a-box>
                    </a-marker>
                    <a-entity camera></a-entity>
                </a-scene>`;
            arContainer.innerHTML += sceneHTML;
        }
    </script>
</body>
</html>
