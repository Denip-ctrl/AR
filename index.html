<!DOCTYPE html>
<html>
<head>
    <title>AR English Pilot - Fixed</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@master/aframe/build/aframe-ar.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        /* Forces the video to be visible in iframes */
        #arjs-video {
            display: block !important;
            width: 100vw !important;
            height: 100vh !important;
            object-fit: cover !important;
        }
    </style>
</head>
<body>
    <a-scene arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;">
        
        <a-marker preset="hiro">
            <a-box position="0 0.5 0" material="color: #FFD700; opacity: 0.8" 
                   animation="property: rotation; to: 0 360 0; loop: true; dur: 3000"></a-box>
            <a-text value="PILOT: HIRO OK" position="0 1.2 0" align="center" rotation="-90 0 0" color="white"></a-text>
        </a-marker>
        
        <a-entity camera></a-entity>
    </a-scene>
</body>
</html>
