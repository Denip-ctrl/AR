<!DOCTYPE html>
<html>
<head>
    <title>AR Pilot - Master Entry</title>
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@master/aframe/build/aframe-ar.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; }
        
        /* The UI Buffer Overlay */
        #ui-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1000; display: flex; flex-direction: column;
            justify-content: center; align-items: center; background: #111;
        }
        
        button {
            padding: 20px 40px; font-size: 18px; font-weight: bold;
            background: #FFD700; border: none; border-radius: 50px;
            cursor: pointer; transition: 0.3s;
        }
        
        button:hover { transform: scale(1.1); background: #fff; }
        
        #status-text { color: #888; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div style="text-align: center; color: white;">
            <h2 style="margin-bottom: 5px;">English AR Pilot</h2>
            <p style="margin-bottom: 25px; opacity: 0.7;">Ready to scan the Hiro Marker?</p>
        </div>
        <button id="startBtn">ACTIVATE EXPERIENCE</button>
        <div id="status-text">Waiting for user interaction...</div>
    </div>

    <a-scene id="arScene" embedded arjs="sourceType: webcam; debugUIEnabled: false;" style="display: none;">
        
        <a-marker preset="hiro">
            <a-box position="0 0.5 0" material="color: #FFD700; opacity: 0.8" 
                   animation="property: rotation; to: 0 360 0; loop: true; dur: 3000"></a-box>
            <a-text value="PILOT: HIRO OK" position="0 1.2 0" align="center" rotation="-90 0 0" color="white"></a-text>
        </a-marker>
        
        <a-entity camera></a-entity>
    </a-scene>

    <script>
        const startBtn = document.getElementById('startBtn');
        const uiLayer = document.getElementById('ui-layer');
        const arScene = document.getElementById('arScene');
        const statusText = document.getElementById('status-text');

        startBtn.onclick = () => {
            statusText.innerText = "Requesting Camera Access...";
            
            // This manually triggers the permission gate
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
                .then((stream) => {
                    statusText.innerText = "Permission Granted. Initializing AR Engine...";
                    
                    // Hide the UI and Show the Scene
                    uiLayer.style.display = 'none';
                    arScene.style.display = 'block';
                    
                    // Force a window resize to make AR.js recalculate the camera matrix
                    // This is the final 'fix' for the changeMatrixMode issue
                    window.dispatchEvent(new Event('resize'));
                })
                .catch((err) => {
                    statusText.innerText = "Error: " + err.message;
                    console.error(err);
                });
        };
    </script>
</body>
</html>
