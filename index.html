<!DOCTYPE html>
<html>
<head>
    <title>AR English Pilot</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        /* This forces the camera feed to be visible even inside Blogger */
        body { margin: 0; overflow: hidden; background-color: #000; }
        .a-canvas { position: absolute !important; top: 0; left: 0; }
        video { 
            position: absolute !important; 
            top: 0; 
            left: 0; 
            z-index: -1; /* Puts video behind the 3D box */
            display: block !important; 
            width: 100% !important; 
            height: 100% !important; 
            object-fit: cover !important;
        }
    </style>
</head>
<body>
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; videoTexture: true;">
        
        <a-marker preset="hiro">
            <a-box position="0 0.5 0" material="color: #FFD700; opacity: 0.8" 
                   animation="property: rotation; to: 0 360 0; loop: true; dur: 3000"></a-box>
            <a-text value="PILOT: HIRO OK" position="0 1.2 0" align="center" rotation="-90 0 0" color="white"></a-text>
        </a-marker>
        
        <a-entity camera></a-entity>
    </a-scene>
</body>
</html>
