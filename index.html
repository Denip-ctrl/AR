<!DOCTYPE html>
<html>
<head>
    <title>AR English Pilot</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>body { margin: 0; overflow: hidden; }</style>
</head>
<body>
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
        <a-marker preset="hiro">
            <a-box position="0 0.5 0" material="color: #FFD700; opacity: 0.8" 
                   animation="property: rotation; to: 0 360 0; loop: true; dur: 3000"></a-box>
            <a-text value="PILOT: HIRO OK" position="0 1.2 0" align="center" rotation="-90 0 0" color="white"></a-text>
        </a-marker>
        <a-entity camera></a-entity>
    </a-scene>
</body>
</html>
